name: MediCore Healthcare Platform CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  # ----------------------------------------------------------------------------
  # 1. Express Backend Automated Test Suite
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Jest Tests & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Backend TypeScript Compile
        run: npm run build --workspace=apps/backend

      - name: Execute Automated Backend Test Suite
        run: npm --workspace=apps/backend run test

  # ----------------------------------------------------------------------------
  # 2. Python FastAPI Analytics & Processing Test Suite
  # ----------------------------------------------------------------------------
  python-analytics-test:
    name: Python Analytics Pytest & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Requirements
        run: pip install -r apps/analytics-service/requirements.txt

      - name: Execute Pytest Validation & Benchmark Tests
        run: |
          cd apps/analytics-service
          export PYTHONPATH="."
          python -m pytest tests -v

  # ----------------------------------------------------------------------------
  # 3. Next.js Frontend Build & Lint
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Next.js Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Build Next.js Production Bundle
        run: npm run build --workspace=apps/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_ANALYTICS_URL: http://localhost:8000

  # ----------------------------------------------------------------------------
  # 4. Security & Vulnerability Scanning
  # ----------------------------------------------------------------------------
  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Monorepo Security Audit
        run: npm audit --audit-level=high || true
