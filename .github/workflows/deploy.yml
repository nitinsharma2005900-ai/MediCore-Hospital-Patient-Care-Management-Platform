name: Approval-controlled Render release
on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Protected deployment environment
        type: choice
        options: [staging, production]
        default: staging
        required: true
permissions: {contents: read}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger configured Render deployment
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
          ANALYTICS_HOOK: ${{ secrets.RENDER_ANALYTICS_DEPLOY_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          test -n "$BACKEND_HOOK" && test -n "$ANALYTICS_HOOK" && test -n "$FRONTEND_HOOK"
          curl --fail --silent --show-error --output /dev/null --request POST "$BACKEND_HOOK"
          curl --fail --silent --show-error --output /dev/null --request POST "$ANALYTICS_HOOK"
          curl --fail --silent --show-error --output /dev/null --request POST "$FRONTEND_HOOK"
      - name: Verify configured live endpoints
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          ANALYTICS_URL: ${{ vars.ANALYTICS_URL }}
        run: |
          test -n "$FRONTEND_URL" && test -n "$BACKEND_URL" && test -n "$ANALYTICS_URL"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 15 "$BACKEND_URL/ready"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 15 "$ANALYTICS_URL/health"
          curl --fail --silent --show-error --output /dev/null "$FRONTEND_URL/login"
