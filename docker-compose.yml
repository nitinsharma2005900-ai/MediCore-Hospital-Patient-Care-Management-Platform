services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicore}
      POSTGRES_DB: ${POSTGRES_DB:-medicore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  backend:
    build: {context: ., dockerfile: apps/backend/Dockerfile}
    environment: &backend_env
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-medicore}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medicore}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Generate JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Generate JWT_REFRESH_SECRET}
      CORS_ORIGIN: http://localhost:3010
      SEED_DEMO: 'true'
      RUN_WORKER: 'false'
    ports: ['127.0.0.1:4010:4000']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal, public]
  analytics:
    build: {context: ., dockerfile: apps/analytics-service/Dockerfile}
    environment: {BACKEND_BASE_URL: 'http://backend:4000', CORS_ORIGIN: 'http://localhost:3010'}
    ports: ['127.0.0.1:8010:8000']
    depends_on:
      backend: {condition: service_healthy}
    networks: [internal, public]
  worker:
    build: {context: ., dockerfile: apps/backend/Dockerfile}
    command: [node, apps/backend/dist/jobs/runner.js]
    environment: *backend_env
    healthcheck: {disable: true}
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal, public]
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args: {BACKEND_BASE_URL: 'http://backend:4000', ANALYTICS_SERVICE_URL: 'http://analytics:8000'}
    ports: ['127.0.0.1:3010:3000']
    depends_on:
      backend: {condition: service_healthy}
      analytics: {condition: service_healthy}
    networks: [public]
networks:
  internal: {internal: true}
  public: {}
volumes:
  postgres_data: {}
  redis_data: {}
