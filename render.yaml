# Render.com Blueprint Infrastructure-as-Code Configuration
# MediCore - Hospital, Appointment & Patient Care Management Platform
services:
  # 1. Next.js Frontend Web Service
  - type: web
    name: medicore-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=apps/frontend
    startCommand: npm --workspace=apps/frontend run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: medicore-backend
          property: host
          value: https://${host}/api/v1
      - key: NEXT_PUBLIC_ANALYTICS_URL
        fromService:
          type: web
          name: medicore-analytics
          property: host
          value: https://${host}

  # 2. Node.js Express Primary Business API
  - type: web
    name: medicore-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=apps/backend
    startCommand: npm --workspace=apps/backend run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: medicore-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

  # 3. Python FastAPI Clinical Analytics Microservice
  - type: web
    name: medicore-analytics
    env: python
    plan: free
    buildCommand: pip install -r apps/analytics-service/requirements.txt
    startCommand: python -m uvicorn main:app --app-dir apps/analytics-service --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: BACKEND_BASE_URL
        fromService:
          type: web
          name: medicore-backend
          property: host
          value: https://${host}

databases:
  # 4. Managed PostgreSQL Database
  - name: medicore-db
    plan: free
    postgresMajorVersion: 16
    databaseName: medicore_db
    user: medicore_user
