# Demo-only free deployment. Review reuse and plan availability before Blueprint approval.
# Free web services cannot receive private-network requests, so supply their public HTTPS URLs.
# No dedicated free worker: RUN_WORKER starts the BullMQ consumer inside the API process.
services:
  - type: web
    name: medicore-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=packages/shared && npm run build --workspace=apps/backend
    startCommand: node apps/backend/dist/server.js
    healthCheckPath: /ready
    envVars:
      - {key: NODE_ENV, value: production}
      - key: DATABASE_URL
        fromDatabase: {name: medicore-db, property: connectionString}
      - key: REDIS_URL
        fromService: {name: medicore-redis, type: keyvalue, property: connectionString}
      - {key: JWT_ACCESS_SECRET, generateValue: true}
      - {key: JWT_REFRESH_SECRET, generateValue: true}
      - {key: SEED_DEMO, value: 'true'}
      - {key: RUN_WORKER, value: 'true'}
      - {key: CORS_ORIGIN, sync: false}
  - type: web
    name: medicore-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r apps/analytics-service/requirements.txt
    startCommand: uvicorn main:app --app-dir apps/analytics-service --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - {key: PYTHON_VERSION, value: '3.13.9'}
      - {key: BACKEND_BASE_URL, sync: false}
      - {key: CORS_ORIGIN, sync: false}
  - type: web
    name: medicore-frontend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=packages/shared && npm run build --workspace=apps/frontend
    startCommand: npm run start --workspace=apps/frontend
    healthCheckPath: /
    envVars:
      - {key: NODE_ENV, value: production}
      - {key: BACKEND_BASE_URL, sync: false}
      - {key: ANALYTICS_SERVICE_URL, sync: false}
  - type: keyvalue
    name: medicore-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
databases:
  - name: medicore-db
    plan: free
    postgresMajorVersion: '16'
    databaseName: medicore
    user: medicore
    ipAllowList: []
